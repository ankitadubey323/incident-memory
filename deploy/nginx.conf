# /etc/nginx/sites-available/incident-memory
#
# TLS termination + bearer-token gate in front of the MCP server.
#   1. Replace MCP_HOST with your domain (or the EC2 public DNS name).
#   2. Replace CHANGE_ME with:  openssl rand -hex 32
#   3. If using certbot:  sudo certbot --nginx -d MCP_HOST   (it rewrites the ssl_* lines)
#      If self-signed:     point ssl_certificate/_key at your .crt/.key

server {
    listen 443 ssl;
    server_name MCP_HOST;

    ssl_certificate     /etc/letsencrypt/live/MCP_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/MCP_HOST/privkey.pem;

    location /mcp {
        if ($http_authorization != "Bearer CHANGE_ME") {
            return 401;
        }
        proxy_pass http://127.0.0.1:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;              # required for SSE streaming responses
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name MCP_HOST;
    return 301 https://$host$request_uri;
}
