[project]
name = "incident-memory"
version = "0.1.0"
description = "MCP server giving AI agents long-term memory of production incidents, backed by DynamoDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2",
    "boto3>=1.35",
    "pydantic>=2.7",
    "python-ulid>=2.7",
]

[project.scripts]
incident-memory = "incident_memory.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb]>=5",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
